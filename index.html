<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8f5">
<meta name="description" content="A little countdown to September 18, 2026.">
<title>Until We Meet Again</title>
<style>
  :root{
    --bg1:#fff8f5;
    --bg2:#f8eef4;
    --ink:#3f3438;
    --muted:#8c7d83;
    --accent:#b76e79;
    --card:rgba(255,255,255,.68);
    --line:rgba(63,52,56,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%,rgba(255,255,255,.95),transparent 28%),
      radial-gradient(circle at 90% 80%,rgba(233,198,208,.38),transparent 30%),
      linear-gradient(145deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  .wrap{width:min(760px,100%);text-align:center;position:relative}
  .tiny{letter-spacing:.22em;text-transform:uppercase;font-size:.68rem;color:var(--muted);font-weight:600}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2.25rem,8vw,4.2rem);line-height:1.05;margin:14px 0 10px}
  .date{font-size:1rem;color:var(--muted);margin-bottom:30px}
  .heart{font-size:1.05rem;color:var(--accent);margin:4px 0 20px}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 auto 22px}
  .unit{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:24px 8px 19px;backdrop-filter:blur(10px);
    box-shadow:0 12px 35px rgba(86,55,65,.06);
  }
  .num{font-variant-numeric:tabular-nums;font-size:clamp(2.4rem,10vw,5rem);font-weight:300;line-height:1}
  .label{margin-top:10px;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .milestones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .milestone{
    text-align:left;background:rgba(255,255,255,.48);border:1px solid var(--line);
    border-radius:18px;padding:17px 18px;
  }
  .milestone .title{font-size:.82rem;font-weight:650;margin-bottom:6px}
  .milestone .time{font-size:1rem}
  .milestone .sub{font-size:.74rem;color:var(--muted);margin-top:4px}
  .footer{margin-top:28px;color:var(--muted);font-size:.76rem;line-height:1.6}
  .done{font-family:Georgia,serif;font-size:clamp(2.5rem,9vw,4.5rem);margin:30px 0}
  .pulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.015);opacity:.82}}
  @media(max-width:520px){
    body{padding:18px}
    .countdown{gap:7px}
    .unit{padding:22px 4px 17px;border-radius:18px}
    .milestones{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="tiny">September 18, 2026</div>
  <h1 id="heading">Until We Meet Again</h1>
  <div class="heart">♡</div>
  <div class="date" id="status">Counting down to 10:00 AM Nepal time</div>

  <section class="countdown" id="countdown" aria-label="Countdown">
    <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </section>

  <section class="milestones">
    <div class="milestone">
      <div class="title">✈︎ Landing</div>
      <div class="time">8:50 AM · Nepal</div>
      <div class="sub">5:05 AM · Vienna</div>
    </div>
    <div class="milestone">
      <div class="title">♡ Together</div>
      <div class="time">10:00 AM · Nepal</div>
      <div class="sub">6:15 AM · Vienna</div>
    </div>
  </section>

  <div class="footer">
    Nepal time · UTC+5:45 &nbsp;•&nbsp; Vienna time shown for September 18
  </div>
</main>

<script>
  // Final moment: September 18, 2026 at 10:00 AM Nepal time (UTC+5:45).
  const target = new Date("2026-09-18T04:15:00Z");

  const $ = id => document.getElementById(id);
  function pad(n){ return String(Math.max(0,n)).padStart(2,"0"); }

  function tick(){
    const diff = target - new Date();
    if(diff <= 0){
      $("countdown").innerHTML = '<div class="done pulse" style="grid-column:1/-1">It’s time ♡</div>';
      $("heading").textContent = "Together";
      $("status").textContent = "September 18, 2026 · 10:00 AM Nepal";
      return;
    }
    const totalSeconds = Math.floor(diff/1000);
    const days = Math.floor(totalSeconds/86400);
    const hours = Math.floor((totalSeconds%86400)/3600);
    const minutes = Math.floor((totalSeconds%3600)/60);
    const seconds = totalSeconds%60;
    $("days").textContent = pad(days);
    $("hours").textContent = pad(hours);
    $("minutes").textContent = pad(minutes);
    $("seconds").textContent = pad(seconds);
  }
  tick();
  setInterval(tick,1000);
</script>
</body>
</html>
